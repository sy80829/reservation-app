name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: pnpmをセットアップ
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      - name: 型チェック
        run: npx tsc --noEmit

      - name: lint
        run: pnpm lint

      - name: ビルド確認
        run: pnpm build
